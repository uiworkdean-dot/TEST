<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RICH & ROLL 火球祭活動頁">
<meta name="theme-color" content="#55c2c2">
<title>RICH & ROLL｜GET YOUR RICH</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main class="page">
  <div class="canvas" id="campaign">
    <!-- HERO -->
    <section class="hero" aria-label="RICH & ROLL">
      <div class="halftone halftone-hero-left"></div>
      <div class="halftone halftone-hero-right"></div>
      <img class="asset brand" src="./assets/brand-fireball-richclub.png" alt="Fireball x RICHCLUB">
      <img class="asset main-title" src="./assets/main-title.png" alt="RICH & ROLL GET YOUR RICH">
      <img class="asset plane" src="./assets/plane.png" alt="">
      <img class="asset checker" src="./assets/checker.png" alt="">
      <img class="asset star" src="./assets/star.png" alt="">
      <img class="asset cloud cloud-a" src="./assets/cloud.png" alt="">
      <img class="asset cloud cloud-b" src="./assets/cloud.png" alt="">
      <img class="asset cloud cloud-c" src="./assets/cloud.png" alt="">
      <img class="asset cloud cloud-d" src="./assets/cloud.png" alt="">
      <img class="asset speaker speaker-top" src="./assets/speaker-top.png" alt="">
    </section>

    <!-- GIFT -->
    <section class="gift" aria-labelledby="gift-title">
      <div class="gift-bg"></div>
      <div class="torn torn-top"></div>
      <div class="torn torn-bottom"></div>
      <div class="halftone halftone-gift-left"></div>
      <div class="halftone halftone-gift-right"></div>

      <div class="section-title gift-title">
        <div class="title-en" id="gift-title">JUST FOR YOU</div>
        <div class="title-zh">會員下單禮</div>
      </div>

      <img class="asset speaker speaker-bottom" src="./assets/speaker-bottom.png" alt="">
      <img class="asset lightning" src="./assets/lightning.png" alt="">
      <img class="asset headphones" src="./assets/headphones.png" alt="">

      <div class="gift-copy">
        <div class="gift-tags">
          <div>消費滿NT$888贈</div>
          <div>RICHCLUB × 火球祭</div>
          <div>聯名購物袋</div>
        </div>
        <p class="gift-note">每個會員帳號限領乙份，數量有限，贈完為止<br>圖片僅供參考，依實際贈品為主</p>
        <div class="gift-actions">
          <button class="pill pill-outline" type="button" data-event="campaign_info_click" data-position="gift_rules">活動辦法</button>
          <button class="pill pill-solid" type="button" data-event="campaign_cta_click" data-position="gift_claim">立刻領取 ›</button>
        </div>
      </div>
      <img class="asset gift-photo" src="./assets/gift-photo.png" alt="火球祭聯名購物袋與贈品">
    </section>

    <!-- TREND -->
    <section class="trend" aria-labelledby="trend-title">
      <div class="section-title trend-title">
        <div class="title-en" id="trend-title">POPULAR TREND</div>
        <div class="title-zh">潮流選物</div>
      </div>

      <img class="asset rock-life" src="./assets/rock-is-life.png" alt="Rock is Life">
      <img class="asset good-music" src="./assets/good-music.png" alt="Good Music Good People">

      <div class="product-grid">
        <article class="product-card orange-card">
          <h3>耳機音響</h3><img src="./assets/product-01-earphones.png" alt="耳機音響"><a href="#" data-event="promotion_click" data-position="product_01">SHOP NOW</a>
        </article>
        <article class="product-card black-card">
          <h3>時髦包款</h3><img src="./assets/product-02-bag.png" alt="時髦包款"><a href="#" data-event="promotion_click" data-position="product_02">SHOP NOW</a>
        </article>
        <article class="product-card orange-card">
          <h3>經典腕錶</h3><img src="./assets/product-03-watch.png" alt="經典腕錶"><a href="#" data-event="promotion_click" data-position="product_03">SHOP NOW</a>
        </article>
        <article class="product-card black-card">
          <h3>品味配件</h3><img src="./assets/product-04-accessories.png" alt="品味配件"><a href="#" data-event="promotion_click" data-position="product_04">SHOP NOW</a>
        </article>
        <article class="product-card orange-card">
          <h3>3C周邊</h3><img src="./assets/product-05-3c.png" alt="3C周邊"><a href="#" data-event="promotion_click" data-position="product_05">SHOP NOW</a>
        </article>
        <article class="product-card orange-card">
          <h3>潮玩收藏</h3><img src="./assets/product-06-toys.png" alt="潮玩收藏"><a href="#" data-event="promotion_click" data-position="product_06">SHOP NOW</a>
        </article>
        <article class="product-card black-card">
          <h3>流行香水</h3><img src="./assets/product-07-perfume.png" alt="流行香水"><a href="#" data-event="promotion_click" data-position="product_07">SHOP NOW</a>
        </article>
        <article class="product-card orange-card">
          <h3>人氣保養</h3><img src="./assets/product-08-beauty.png" alt="人氣保養"><a href="#" data-event="promotion_click" data-position="product_08">SHOP NOW</a>
        </article>
      </div>

      <a class="shop-more" href="#" data-event="campaign_more_click" data-position="product_more">SHOP MORE ›</a>
    </section>
  </div>
</main>
<script src="./js/script.js"></script>
</body>
</html>
